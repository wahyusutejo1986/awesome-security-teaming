<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awesome Security Teaming | Open-Source Red, Blue & Purple Teaming Catalog</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A community-driven, evidence-based catalog of open-source tools for Red, Blue, and Purple Teaming.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Awesome Security Teaming">
  <meta property="og:description" content="A community-driven, evidence-based catalog of open-source tools for Red, Blue, and Purple Teaming.">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  
  <!-- Docsify Themeable Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #8b5cf6;
      --sidebar-width: 19rem;
      --content-max-width: 68rem;
    }
    
    /* Dark Mode Defaults & Styling */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0b0f19;
        color: #e2e8f0;
      }
      .sidebar {
        background-color: #070a12;
        border-right: 1px solid #1e293b;
      }
      .sidebar-nav a {
        color: #94a3b8;
      }
      .sidebar-nav a:hover,
      .sidebar-nav li.active > a {
        color: #a78bfa;
      }
      .sidebar-nav strong {
        color: #f1f5f9;
        font-weight: 700;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .app-nav a {
        color: #94a3b8;
      }
      .app-nav a:hover {
        color: #c084fc;
      }
    }
    
    /* Navbar styling */
    .app-nav {
      margin: 15px 25px 0 0;
      font-size: 0.9rem;
    }
    .app-nav li {
      display: inline-block;
      margin: 0 10px;
    }

    /* Table styling */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.92rem;
    }
    .markdown-section th {
      background: #1e1b4b;
      color: #e0e7ff;
      border: 1px solid #312e81;
      padding: 10px 14px;
      font-weight: 600;
      text-align: left;
    }
    .markdown-section td {
      border: 1px solid #1f2937;
      padding: 9px 14px;
    }
    .markdown-section tr:nth-child(even) td {
      background: rgba(30, 41, 59, 0.25);
    }
    
    .app-name-link {
      font-weight: 800;
      font-size: 1.12rem;
      letter-spacing: -0.02em;
    }

    /* Search Input Styling */
    .search input {
      border-radius: 8px !important;
      padding: 10px 14px !important;
      border: 1px solid #334155 !important;
      background: rgba(15, 23, 42, 0.6) !important;
      color: #f8fafc !important;
    }
    .search input:focus {
      border-color: #8b5cf6 !important;
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2) !important;
    }

    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid #8b5cf6;
      background: rgba(139, 92, 246, 0.06);
      padding: 10px 16px;
      border-radius: 0 8px 8px 0;
    }

    /* Code Blocks */
    .markdown-section pre>code {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">Loading Awesome Security Teaming...</div>
  <script>
    window.$docsify = {
      name: '🛡️ Security Teaming',
      repo: 'https://github.com/wahyusutejo1986/awesome-security-teaming',
      loadSidebar: true,
      loadNavbar: true,
      autoHeader: false,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search tools, capabilities, or teams...',
        noData: 'No matching tools found!',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Failed',
        successText: 'Copied!'
      }
    }
  </script>
  
  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- Copy to Clipboard -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Zoom Image Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  
  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>

  <!-- Docsify Themeable -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>

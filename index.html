<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awesome Security Teaming | Open-Source Red, Blue & Purple Teaming Catalog</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A community-driven, evidence-based catalog of open-source tools for Red, Blue, and Purple Teaming with architecture breakdowns, use cases, and TCO analysis.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Awesome Security Teaming">
  <meta property="og:description" content="Evidence-based open-source security teaming catalog: usecases, architectures, cost breakdown, and evaluation methodology.">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Docsify Themeable Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <style>
    :root {
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --code-font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      --base-font-size: 15px;
      --base-line-height: 1.65;
      --theme-color: #8b5cf6;
      --sidebar-width: 20rem;
      --content-max-width: 72rem;
    }
    
    /* Global Dark Theme */
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: var(--base-font-family);
    }
    
    .sidebar {
      background-color: #070a12;
      border-right: 1px solid #1e293b;
    }
    .sidebar-nav a {
      color: #94a3b8;
      font-size: 0.92rem;
      transition: color 0.15s ease;
    }
    .sidebar-nav a:hover,
    .sidebar-nav li.active > a {
      color: #c084fc;
      font-weight: 600;
    }
    .sidebar-nav strong {
      color: #f1f5f9;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 1.2rem;
      display: inline-block;
    }
    
    /* Navbar styling */
    .app-nav {
      margin: 16px 28px 0 0;
      font-size: 0.92rem;
      font-weight: 500;
    }
    .app-nav li {
      display: inline-block;
      margin: 0 8px;
    }
    .app-nav a {
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .app-nav a:hover {
      color: #ffffff;
      background: rgba(139, 92, 246, 0.2);
    }

    /* Headings */
    .markdown-section h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f8fafc;
      margin-bottom: 1.2rem;
    }
    .markdown-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f1f5f9;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.5rem;
      margin-top: 2.5rem;
    }
    .markdown-section h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 1.8rem;
    }

    /* Table styling */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.8rem 0;
      font-size: 0.9rem;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .markdown-section th {
      background: #1e1b4b;
      color: #e0e7ff;
      border: 1px solid #312e81;
      padding: 12px 16px;
      font-weight: 700;
      text-align: left;
      letter-spacing: 0.02em;
    }
    .markdown-section td {
      border: 1px solid #1e293b;
      padding: 11px 16px;
      vertical-align: middle;
    }
    .markdown-section tr:nth-child(even) td {
      background: rgba(15, 23, 42, 0.5);
    }
    .markdown-section tr:hover td {
      background: rgba(139, 92, 246, 0.08);
    }
    
    /* Dynamic Pill Badges in Tables */
    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      border-radius: 12px;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }
    .badge-verified {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-unverified {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-not-assessed {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .badge-lab-ready {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .badge-enterprise-candidate {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .badge-cap {
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border: 1px solid #334155;
      margin: 2px;
    }

    /* Brand Logo / App Title */
    .app-name-link {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: #f8fafc !important;
    }

    /* Search Box */
    .search input {
      border-radius: 8px !important;
      padding: 10px 14px !important;
      border: 1px solid #334155 !important;
      background: rgba(15, 23, 42, 0.7) !important;
      color: #f8fafc !important;
      font-family: var(--base-font-family) !important;
    }
    .search input:focus {
      border-color: #8b5cf6 !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25) !important;
    }

    /* Callouts & Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid #8b5cf6;
      background: rgba(139, 92, 246, 0.08);
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      color: #cbd5e1;
      margin: 1.5rem 0;
    }

    /* Code blocks */
    .markdown-section pre>code {
      border-radius: 8px;
      font-family: var(--code-font-family);
      font-size: 0.88rem;
    }
    .markdown-section code {
      font-family: var(--code-font-family);
      font-size: 0.88rem;
    }

    /* Card Box Utility */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
      margin: 1.8rem 0;
    }
    .card-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1.25rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card-box:hover {
      transform: translateY(-2px);
      border-color: #8b5cf6;
    }
    .card-box h4 {
      margin: 0 0 0.5rem 0;
      color: #f8fafc;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .card-box p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">Loading Awesome Security Teaming...</div>
  <script>
    window.$docsify = {
      name: '🛡️ Security Teaming',
      repo: 'https://github.com/wahyusutejo1986/awesome-security-teaming',
      loadSidebar: true,
      loadNavbar: true,
      autoHeader: false,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search tools, capabilities, or teams...',
        noData: 'No matching tools found!',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Failed',
        successText: 'Copied!'
      },
      plugins: [
        function(hook) {
          hook.doneEach(function() {
            // Transform table text into stylish pill badges
            var cells = document.querySelectorAll('.markdown-section td');
            cells.forEach(function(td) {
              var text = td.textContent.trim();
              if (text === 'verified') {
                td.innerHTML = '<span class="badge-pill badge-verified">✓ verified</span>';
              } else if (text === 'unverified') {
                td.innerHTML = '<span class="badge-pill badge-unverified">⚠ unverified</span>';
              } else if (text === 'not-assessed') {
                td.innerHTML = '<span class="badge-pill badge-not-assessed">not-assessed</span>';
              } else if (text === 'lab-ready') {
                td.innerHTML = '<span class="badge-pill badge-lab-ready">lab-ready</span>';
              } else if (text === 'enterprise-candidate') {
                td.innerHTML = '<span class="badge-pill badge-enterprise-candidate">enterprise-candidate</span>';
              }
            });
          });
        }
      ]
    }
  </script>
  
  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- Copy to Clipboard -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Zoom Image Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  
  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>

  <!-- Docsify Themeable -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>

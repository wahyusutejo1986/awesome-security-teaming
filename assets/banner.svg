<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="40%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#140f26" />
    </linearGradient>

    <!-- Tri-Color Team Gradients -->
    <!-- Red Team -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    
    <!-- Purple Team -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Blue Team -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="48%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="100" r="140" fill="#dc2626" opacity="0.12" filter="url(#glowRed)" />
  <circle cx="600" cy="210" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glowPurple)" />
  <circle cx="1080" cy="300" r="160" fill="#2563eb" opacity="0.12" filter="url(#glowBlue)" />

  <!-- Geometric Tech Lines & Circuits -->
  <path d="M 40 380 L 220 380 L 280 340 L 480 340" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.4" />
  <circle cx="480" cy="340" r="4" fill="#f87171" />

  <path d="M 720 80 L 920 80 L 980 120 L 1160 120" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4" />
  <circle cx="720" cy="80" r="4" fill="#60a5fa" />

  <!-- Center Shield Icon Graphic -->
  <g transform="translate(600, 105) scale(0.95)">
    <!-- Central Hexagonal Tech Rings -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.5" />
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#purpleGrad)" stroke-width="2.5" />
    
    <!-- Red, Purple, Blue Nodes -->
    <circle cx="-32" cy="-18" r="7" fill="url(#redGrad)" filter="url(#glowRed)" />
    <circle cx="0" cy="28" r="8" fill="url(#purpleGrad)" filter="url(#glowPurple)" />
    <circle cx="32" cy="-18" r="7" fill="url(#blueGrad)" filter="url(#glowBlue)" />
    
    <!-- Connection lines -->
    <line x1="-32" y1="-18" x2="0" y2="28" stroke="#f87171" stroke-width="2" opacity="0.7" />
    <line x1="0" y1="28" x2="32" y2="-18" stroke="#60a5fa" stroke-width="2" opacity="0.7" />
    <line x1="32" y1="-18" x2="-32" y2="-18" stroke="#c084fc" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Typography -->
  <!-- Top Category Label -->
  <g transform="translate(600, 215)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#a5b4fc">
      OPEN-SOURCE SECURITY TEAMIN' FRAMEWORK
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)">
    AWESOME SECURITY TEAMING
  </text>

  <!-- Subtitle -->
  <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    Evidence-Based Catalog of Open-Source Tools for Red, Blue, and Purple Teaming
  </text>

  <!-- Three Team Pills at Bottom -->
  <g transform="translate(600, 368)">
    <!-- Red Team Pill -->
    <g transform="translate(-230, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#450a0a" stroke="#dc2626" stroke-width="1.2" />
      <circle cx="-62" cy="0" r="5" fill="#ef4444" />
      <text x="5" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">
        RED TEAMING
      </text>
    </g>

    <!-- Purple Team Pill -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#2e1065" stroke="#9333ea" stroke-width="1.2" />
      <circle cx="-72" cy="0" r="5" fill="#c084fc" />
      <text x="5" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">
        PURPLE TEAMING
      </text>
    </g>

    <!-- Blue Team Pill -->
    <g transform="translate(230, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#172554" stroke="#2563eb" stroke-width="1.2" />
      <circle cx="-62" cy="0" r="5" fill="#60a5fa" />
      <text x="5" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#bfdbfe">
        BLUE TEAMING
      </text>
    </g>
  </g>
</svg>

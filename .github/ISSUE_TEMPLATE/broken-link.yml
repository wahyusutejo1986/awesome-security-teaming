name: Report Broken Link
description: Report an outdated, moved, or dead upstream repository link
title: "[Broken Link] "
labels: ["bug", "broken-link"]
body:
  - type: input
    id: tool_name
    attributes:
      label: Tool Name
      description: Which tool has the broken link?
    validations:
      required: true
  - type: input
    id: current_url
    attributes:
      label: Current Broken URL
      description: The URL currently listed in the catalog
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      options:
        - HTTP 404 / Repository Deleted
        - Repository Moved / Transferred
        - Upstream Abandoned / Archived
        - URL Redirects to Suspicious / Unrelated Content
    validations:
      required: true
  - type: input
    id: replacement_url
    attributes:
      label: Proposed Replacement URL (Optional)
      description: Official new upstream repository or archive if known
    validations:
      required: false
